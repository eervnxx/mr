<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم | Restaurant Menu</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #ffa502;
            --accent: #2ed573;
            --dark: #1e1e2e;
            --darker: #16162a;
            --card-bg: rgba(30, 30, 50, 0.8);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-secondary: #b0b0c0;
            --gradient-1: linear-gradient(135deg, #ff4757, #ff6b81);
            --gradient-2: linear-gradient(135deg, #ffa502, #ff6348);
            --gradient-bg: linear-gradient(135deg, #0c0c1d 0%, #1a1a35 50%, #0f0f25 100%);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--gradient-bg);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }

        .particle { position: absolute; border-radius: 50%; background: var(--primary); animation: float linear infinite; opacity: 0.15; }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        .header { position: sticky; top: 0; z-index: 100; background: rgba(14,14,30,0.7); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border-bottom: 1px solid var(--glass-border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }

        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 42px; height: 42px; background: var(--gradient-1); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 15px rgba(255,71,87,0.4); animation: pulse 2s ease-in-out infinite; }

        @keyframes pulse { 0%,100% { box-shadow: 0 4px 15px rgba(255,71,87,0.4); } 50% { box-shadow: 0 4px 30px rgba(255,71,87,0.7); } }

        .logo-text { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text .accent { background: var(--gradient-2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header-actions { display: flex; gap: 8px; }

        .btn-icon-header { width: 40px; height: 40px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .btn-icon-header:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }

        .btn-admin { background: var(--gradient-1); border: none; color: white; padding: 10px 18px; border-radius: 14px; cursor: pointer; font-size: 14px; font-weight: 600; transition: var(--transition); box-shadow: 0 4px 15px rgba(255,71,87,0.3); white-space: nowrap; }
        .btn-admin:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,71,87,0.5); }
        .btn-admin:active { transform: scale(0.95); }

        .main-content { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; padding: 20px 16px 80px; }
        .hero-section { text-align: center; padding: 30px 0 20px; }
        .hero-badge { display: inline-block; background: var(--glass); border: 1px solid var(--glass-border); padding: 6px 16px; border-radius: 50px; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
        .hero-title { font-size: clamp(28px,7vw,48px); font-weight: 900; margin-bottom: 6px; letter-spacing: -1px; line-height: 1.2; }
        .hero-title .highlight { background: var(--gradient-2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hero-subtitle { color: var(--text-secondary); font-size: clamp(14px,3vw,17px); }

        .search-wrapper { position: relative; max-width: 500px; margin: 20px auto 0; }
        .search-input { width: 100%; padding: 16px 50px 16px 20px; border-radius: 20px; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text); font-size: 16px; outline: none; transition: var(--transition); }
        .search-input::placeholder { color: var(--text-secondary); }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,71,87,0.15); background: rgba(255,255,255,0.08); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 18px; pointer-events: none; }

        .categories-wrapper { display: flex; gap: 10px; padding: 20px 0; overflow-x: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; justify-content: center; flex-wrap: wrap; }
        .categories-wrapper::-webkit-scrollbar { display: none; }

        .category-chip { flex-shrink: 0; padding: 10px 22px; border-radius: 50px; background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-secondary); cursor: pointer; font-size: 14px; font-weight: 500; transition: var(--transition); white-space: nowrap; }
        .category-chip:hover { background: rgba(255,255,255,0.1); color: var(--text); transform: translateY(-2px); }
        .category-chip.active { background: var(--gradient-1); border-color: transparent; color: white; box-shadow: 0 4px 20px rgba(255,71,87,0.4); font-weight: 600; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; padding: 10px 0; }

        .menu-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-md); overflow: hidden; transition: var(--transition); backdrop-filter: blur(20px); animation: cardAppear 0.5s ease forwards; opacity: 0; cursor: pointer; position: relative; }

        @keyframes cardAppear { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .menu-card:hover { transform: translateY(-8px); box-shadow: 0 20px 60px rgba(0,0,0,0.6); border-color: rgba(255,255,255,0.2); }
        .menu-card:active { transform: scale(0.97); }

        .card-image-wrapper { position: relative; width: 100%; height: 200px; overflow: hidden; background: rgba(0,0,0,0.3); }
        .card-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .menu-card:hover .card-image { transform: scale(1.08); }
        .card-image-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); }

        .card-badge { position: absolute; top: 12px; right: 12px; padding: 6px 14px; border-radius: 50px; font-size: 12px; font-weight: 700; backdrop-filter: blur(20px); }
        .badge-available { background: rgba(46,213,115,0.3); color: #7bed9f; border: 1px solid rgba(46,213,115,0.4); }
        .badge-unavailable { background: rgba(255,71,87,0.3); color: #ff6b81; border: 1px solid rgba(255,71,87,0.4); }

        .card-category-tag { position: absolute; top: 12px; left: 12px; padding: 5px 12px; border-radius: 50px; background: rgba(0,0,0,0.5); backdrop-filter: blur(20px); font-size: 11px; color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.15); }
        .card-body { padding: 18px; }
        .card-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .card-description { color: var(--text-secondary); font-size: 13px; line-height: 1.6; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; }
        .card-price { font-size: 26px; font-weight: 800; background: var(--gradient-2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .card-price-currency { font-size: 13px; font-weight: 400; color: var(--text-secondary); -webkit-text-fill-color: var(--text-secondary); }
        .card-unavailable { opacity: 0.5; filter: grayscale(40%); }
        .card-unavailable:hover { opacity: 0.7; }

        .empty-state { text-align: center; padding: 60px 20px; display: none; }
        .empty-state-icon { font-size: 70px; margin-bottom: 16px; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .empty-state-text { color: var(--text-secondary); font-size: 18px; }

        .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 16px; }
        .loading-spinner { width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-secondary); font-size: 15px; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }

        .modal-dialog { background: var(--dark); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 35px 25px; text-align: center; width: 100%; max-width: 400px; animation: modalIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        @keyframes modalIn { from { transform: scale(0.8) translateY(30px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

        .modal-icon { font-size: 50px; margin-bottom: 16px; }
        .modal-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }

        .modal-input { width: 100%; padding: 15px 18px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text); font-size: 16px; text-align: center; outline: none; transition: var(--transition); margin-bottom: 14px; }
        .modal-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,71,87,0.1); }
        .modal-input::placeholder { color: rgba(255,255,255,0.3); }

        .btn { padding: 14px 28px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; transition: var(--transition); width: 100%; margin-top: 6px; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--gradient-1); color: white; box-shadow: 0 4px 20px rgba(255,71,87,0.3); }
        .btn-primary:hover { box-shadow: 0 8px 30px rgba(255,71,87,0.5); transform: translateY(-2px); }
        .btn-ghost { background: var(--glass); color: var(--text-secondary); border: 1px solid var(--glass-border); }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text); }
        .error-text { color: var(--primary); font-size: 13px; margin-top: 8px; display: none; }

        .admin-panel { display: none; position: fixed; inset: 0; background: var(--darker); z-index: 999; overflow-y: auto; animation: fadeIn 0.3s ease; }
        .admin-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .admin-inner { max-width: 800px; margin: 0 auto; padding: 16px; }
        .admin-navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: rgba(255,255,255,0.03); border-radius: var(--radius-md); margin-bottom: 20px; border: 1px solid var(--glass-border); position: sticky; top: 10px; z-index: 10; backdrop-filter: blur(20px); gap: 12px; flex-wrap: wrap; }
        .admin-navbar h2 { font-size: 18px; font-weight: 700; }
        .btn-close-admin { background: rgba(255,71,87,0.2); color: var(--primary); border: 1px solid rgba(255,71,87,0.3); padding: 10px 18px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; transition: var(--transition); }
        .btn-close-admin:hover { background: rgba(255,71,87,0.4); }

        .admin-card { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; }
        .admin-card h3 { margin-bottom: 16px; font-size: 16px; display: flex; align-items: center; gap: 8px; }

        .form-group { margin-bottom: 14px; }
        .form-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 13px 16px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text); font-size: 15px; font-family: inherit; outline: none; transition: var(--transition); }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,71,87,0.1); }
        .form-textarea { resize: vertical; min-height: 80px; }
        .form-select { cursor: pointer; }
        .form-select option { background: var(--dark); color: var(--text); }

        .toggle-wrapper { display: flex; align-items: center; gap: 12px; }
        .toggle { position: relative; width: 52px; height: 28px; background: rgba(255,255,255,0.1); border-radius: 50px; cursor: pointer; transition: var(--transition); border: 1px solid var(--glass-border); }
        .toggle.active { background: var(--accent); border-color: var(--accent); }
        .toggle::after { content: ''; position: absolute; width: 22px; height: 22px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: var(--transition); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .toggle.active::after { left: 26px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-group { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

        .btn-sm { padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: var(--transition); flex: 1; min-width: 100px; }
        .btn-sm:active { transform: scale(0.95); }
        .btn-add-item { background: var(--accent); color: #000; }
        .btn-add-item:hover { box-shadow: 0 4px 20px rgba(46,213,115,0.4); }
        .btn-update-item { background: var(--secondary); color: #000; }
        .btn-update-item:hover { box-shadow: 0 4px 20px rgba(255,165,2,0.4); }
        .btn-reset-form { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid var(--glass-border); }

        .items-list-header { display: grid; grid-template-columns: 50px 1fr 70px 90px; gap: 8px; padding: 12px 16px; font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--glass-border); }

        .item-row { display: grid; grid-template-columns: 50px 1fr 70px 90px; gap: 8px; padding: 12px 16px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); transition: var(--transition); animation: slideRow 0.3s ease; }
        @keyframes slideRow { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .item-row:hover { background: rgba(255,255,255,0.03); }
        .item-thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
        .item-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .item-info span { font-size: 11px; color: var(--text-secondary); }
        .item-price-cell { font-weight: 700; color: var(--secondary); }
        .item-actions { display: flex; gap: 4px; }

        .btn-icon-sm { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--glass); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .btn-icon-sm:hover { transform: scale(1.1); }
        .btn-edit-sm { color: var(--secondary); border-color: rgba(255,165,2,0.3); background: rgba(255,165,2,0.1); }
        .btn-delete-sm { color: var(--primary); border-color: rgba(255,71,87,0.3); background: rgba(255,71,87,0.1); }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--dark); border: 1px solid var(--glass-border); color: white; padding: 14px 24px; border-radius: 50px; z-index: 2000; font-size: 14px; font-weight: 600; box-shadow: 0 20px 60px rgba(0,0,0,0.6); transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275); backdrop-filter: blur(20px); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--accent); }
        .toast.error { border-color: var(--primary); }

        @media (max-width: 768px) {
            .menu-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
            .form-row { grid-template-columns: 1fr; }
            .items-list-header, .item-row { grid-template-columns: 40px 1fr 55px 75px; }
            .card-image-wrapper { height: 170px; }
            .card-title { font-size: 17px; }
            .card-price { font-size: 22px; }
            .admin-inner { padding: 10px; }
            .admin-navbar { padding: 12px 16px; gap: 8px; }
        }

        @media (max-width: 480px) {
            .menu-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .card-image-wrapper { height: 130px; }
            .card-body { padding: 12px; }
            .card-title { font-size: 15px; }
            .card-description { font-size: 11px; -webkit-line-clamp: 2; }
            .card-price { font-size: 19px; }
            .card-badge, .card-category-tag { font-size: 10px; padding: 4px 10px; }
            .header { padding: 10px 12px; }
            .logo-text { font-size: 18px; }
            .btn-admin { padding: 8px 14px; font-size: 13px; }
            .category-chip { padding: 8px 16px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="bg-particles" id="particles"></div>

    <header class="header" id="header">
        <div class="logo-container">
            <div class="logo-icon">🍽️</div>
            <div class="logo-text">مـ<span class="accent">نيو</span></div>
        </div>
        <div class="header-actions">
            <button class="btn-icon-header" onclick="loadMenuFromFirebase()" title="تحديث">🔄</button>
            <button class="btn-admin" onclick="openPasswordModal()">🔐 الإدارة</button>
        </div>
    </header>

    <main class="main-content">
        <div class="hero-section">
            <div class="hero-badge">✨ قائمة طعام مميزة</div>
            <h1 class="hero-title">أشهى <span class="highlight">المأكولات</span></h1>
            <p class="hero-subtitle">اكتشف مجموعتنا المختارة بعناية</p>
        </div>

        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن وجبتك المفضلة..." oninput="displayMenu()">
        </div>

        <div class="categories-wrapper" id="categoriesBar"></div>

        <div class="loading-container" id="loadingSpinner">
            <div class="loading-spinner"></div>
            <p class="loading-text">جاري تحميل المنيو...</p>
        </div>

        <div class="menu-grid" id="menuGrid"></div>

        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">🍽️</div>
            <p class="empty-state-text">لا توجد أصناف متاحة حالياً</p>
        </div>
    </main>

    <div class="modal-overlay" id="passwordModal">
        <div class="modal-dialog">
            <div class="modal-icon">🔐</div>
            <h2 class="modal-title">دخول المشرف</h2>
            <input type="password" class="modal-input" id="passwordInput" placeholder="كلمة المرور" autocomplete="off">
            <button class="btn btn-primary" onclick="checkPassword()">🚀 دخول</button>
            <button class="btn btn-ghost" onclick="closePasswordModal()">إلغاء</button>
            <p class="error-text" id="errorMsg">❌ كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-inner">
            <div class="admin-navbar">
                <h2>⚙️ لوحة التحكم</h2>
                <button class="btn-close-admin" onclick="closeAdminPanel()">✖ إغلاق</button>
            </div>

            <div class="admin-card">
                <h3 id="formTitle">➕ إضافة صنف جديد</h3>
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label class="form-label">📸 رابط الصورة</label>
                    <input type="text" class="form-input" id="itemImage" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label class="form-label">📝 اسم الصنف *</label>
                    <input type="text" class="form-input" id="itemName" placeholder="مثال: برجر دجاج">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">📂 التصنيف</label>
                        <select class="form-select" id="itemCategory">
                            <option value="وجبات رئيسية">وجبات رئيسية</option>
                            <option value="مقبلات">مقبلات</option>
                            <option value="حلويات">حلويات</option>
                            <option value="مشروبات">مشروبات</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">💰 السعر *</label>
                        <input type="number" class="form-input" id="itemPrice" placeholder="مثال: 25" step="0.01">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">📄 الوصف</label>
                    <textarea class="form-textarea" id="itemDescription" placeholder="وصف مختصر للصنف..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">الحالة</label>
                    <div class="toggle-wrapper">
                        <div class="toggle active" id="availabilityToggle" onclick="toggleAvailability()"></div>
                        <span id="availabilityText" style="font-size:13px;">متوفر</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn-sm btn-add-item" id="btnAdd" onclick="addItem()">✅ إضافة</button>
                    <button class="btn-sm btn-update-item" id="btnUpdate" style="display:none;" onclick="updateItem()">💾 حفظ التعديل</button>
                    <button class="btn-sm btn-reset-form" onclick="resetForm()">🔄 إعادة تعيين</button>
                </div>
            </div>

            <div class="admin-card" style="padding:0;overflow:hidden;">
                <div class="items-list-header">
                    <span>صورة</span>
                    <span>الاسم / التصنيف</span>
                    <span>السعر</span>
                    <span>إجراءات</span>
                </div>
                <div id="adminItemsList"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDToxHcV5WBoW3TyMnjKOzdTn5_8nrxHcI",
            authDomain: "wevaz-e716b.firebaseapp.com",
            projectId: "wevaz-e716b",
            storageBucket: "wevaz-e716b.firebasestorage.app",
            messagingSenderId: "11662784893",
            appId: "1:11662784893:web:24d284abd3096c2e873414",
            measurementId: "G-EVLFHWE125"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const menuCollection = db.collection('menuItems');

        let menuItems = [];
        let currentCategory = 'الكل';
        let isAvailable = true;

        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#ff4757', '#ffa502', '#2ed573', '#ff6b81', '#7bed9f'];
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = particle.style.height = Math.random() * 6 + 3 + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDuration = Math.random() * 15 + 10 + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function loadMenuFromFirebase() {
            const loadingEl = document.getElementById('loadingSpinner');
            const gridEl = document.getElementById('menuGrid');
            const emptyEl = document.getElementById('emptyState');
            
            loadingEl.style.display = 'flex';
            gridEl.innerHTML = '';
            emptyEl.style.display = 'none';

            try {
                const snapshot = await menuCollection.orderBy('createdAt', 'desc').get();
                menuItems = [];
                snapshot.forEach(doc => {
                    menuItems.push({ id: doc.id, firebaseId: doc.id, ...doc.data() });
                });
                
                loadingEl.style.display = 'none';
                displayMenu();
                
                if (document.getElementById('adminPanel').classList.contains('active')) {
                    displayAdminItems();
                }
            } catch (error) {
                loadingEl.style.display = 'none';
                showToast('❌ فشل تحميل البيانات', 'error');
            }
        }

        function displayMenu() {
            const grid = document.getElementById('menuGrid');
            const emptyEl = document.getElementById('emptyState');
            const categoriesBar = document.getElementById('categoriesBar');
            const searchTerm = document.getElementById('searchInput')?.value?.toLowerCase() || '';

            if (menuItems.length === 0) {
                grid.innerHTML = '';
                emptyEl.style.display = 'block';
                categoriesBar.innerHTML = '';
                return;
            }

            emptyEl.style.display = 'none';
            const categories = ['الكل', ...new Set(menuItems.map(i => i.category || 'بدون تصنيف'))];
            
            categoriesBar.innerHTML = categories.map(cat =>
                `<div class="category-chip ${cat === currentCategory ? 'active' : ''}" 
                      onclick="filterByCategory('${cat}')">${cat}</div>`
            ).join('');

            let filtered = menuItems;
            if (currentCategory !== 'الكل') {
                filtered = filtered.filter(i => (i.category || 'بدون تصنيف') === currentCategory);
            }
            if (searchTerm) {
                filtered = filtered.filter(i =>
                    (i.name || '').toLowerCase().includes(searchTerm) ||
                    (i.description || '').toLowerCase().includes(searchTerm)
                );
            }

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyEl.style.display = 'block';
                emptyEl.querySelector('.empty-state-text').textContent = 
                    searchTerm ? '🔍 لا توجد نتائج للبحث' : '🍽️ لا توجد أصناف في هذا التصنيف';
            } else {
                emptyEl.style.display = 'none';
                grid.innerHTML = filtered.map((item, index) => `
                    <div class="menu-card ${!item.available ? 'card-unavailable' : ''}" 
                         style="animation-delay: ${index * 0.06}s">
                        <div class="card-image-wrapper">
                            <img src="${item.image || 'https://placehold.co/400x200/1a1a35/666?text=No+Image'}" 
                                 alt="${item.name}" class="card-image" loading="lazy"
                                 onerror="this.src='https://placehold.co/400x200/1a1a35/666?text=No+Image'">
                            <div class="card-image-overlay"></div>
                            <div class="card-category-tag">${item.category || 'عام'}</div>
                            <div class="card-badge ${item.available ? 'badge-available' : 'badge-unavailable'}">
                                ${item.available ? 'متوفر' : 'غير متوفر'}
                            </div>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title">${item.name}</h3>
                            <p class="card-description">${item.description || 'لا يوجد وصف'}</p>
                            <div class="card-footer">
                                <div class="card-price">${item.price || 0} <span class="card-price-currency">ريال</span></div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function filterByCategory(category) {
            currentCategory = category;
            displayMenu();
        }

        function displayAdminItems() {
            const container = document.getElementById('adminItemsList');
            if (menuItems.length === 0) {
                container.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-secondary);">لا توجد أصناف</div>';
                return;
            }
            container.innerHTML = menuItems.map(item => `
                <div class="item-row">
                    <img src="${item.image || 'https://placehold.co/44/333/666'}" 
                         alt="${item.name}" class="item-thumb"
                         onerror="this.src='https://placehold.co/44/333/666'">
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <span>${item.category || 'بدون تصنيف'} · ${item.available ? 'متوفر' : 'غير متوفر'}</span>
                    </div>
                    <div class="item-price-cell">${item.price || 0} ريال</div>
                    <div class="item-actions">
                        <button class="btn-icon-sm btn-edit-sm" onclick="editItem('${item.firebaseId}')">✏️</button>
                        <button class="btn-icon-sm btn-delete-sm" onclick="deleteItem('${item.firebaseId}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleAvailability() {
            isAvailable = !isAvailable;
            const toggle = document.getElementById('availabilityToggle');
            const text = document.getElementById('availabilityText');
            if (isAvailable) { toggle.classList.add('active'); text.textContent = 'متوفر'; }
            else { toggle.classList.remove('active'); text.textContent = 'غير متوفر'; }
        }

        async function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);
            const image = document.getElementById('itemImage').value.trim();

            if (!name || isNaN(price)) {
                showToast('⚠️ الرجاء ملء الاسم والسعر', 'error');
                return;
            }

            const newItem = {
                name,
                category: document.getElementById('itemCategory').value,
                description: document.getElementById('itemDescription').value.trim() || 'لا يوجد وصف',
                price,
                image: image || 'https://placehold.co/400x200/1a1a35/666?text=No+Image',
                available: isAvailable,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                document.getElementById('btnAdd').disabled = true;
                document.getElementById('btnAdd').textContent = '⏳ جاري الحفظ...';
                await menuCollection.add(newItem);
                resetForm();
                await loadMenuFromFirebase();
                showToast('✅ تمت الإضافة بنجاح!');
            } catch (error) {
                showToast('❌ فشل الإضافة', 'error');
            } finally {
                document.getElementById('btnAdd').disabled = false;
                document.getElementById('btnAdd').textContent = '✅ إضافة';
            }
        }

        function editItem(firebaseId) {
            const item = menuItems.find(i => i.firebaseId === firebaseId);
            if (!item) return;

            document.getElementById('editId').value = firebaseId;
            document.getElementById('itemName').value = item.name || '';
            document.getElementById('itemCategory').value = item.category || 'وجبات رئيسية';
            document.getElementById('itemDescription').value = item.description || '';
            document.getElementById('itemPrice').value = item.price || '';
            document.getElementById('itemImage').value = item.image || '';
            isAvailable = item.available !== false;
            
            const toggle = document.getElementById('availabilityToggle');
            const text = document.getElementById('availabilityText');
            if (isAvailable) { toggle.classList.add('active'); text.textContent = 'متوفر'; }
            else { toggle.classList.remove('active'); text.textContent = 'غير متوفر'; }

            document.getElementById('formTitle').textContent = '✏️ تعديل: ' + item.name;
            document.getElementById('btnAdd').style.display = 'none';
            document.getElementById('btnUpdate').style.display = 'block';
            document.querySelector('.admin-card').scrollIntoView({ behavior: 'smooth' });
        }

        async function updateItem() {
            const firebaseId = document.getElementById('editId').value;
            if (!firebaseId) return;

            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);
            if (!name || isNaN(price)) {
                showToast('⚠️ الرجاء ملء الاسم والسعر', 'error');
                return;
            }

            const updatedData = {
                name, price,
                category: document.getElementById('itemCategory').value,
                description: document.getElementById('itemDescription').value.trim() || 'لا يوجد وصف',
                image: document.getElementById('itemImage').value.trim() || 'https://placehold.co/400x200/1a1a35/666?text=No+Image',
                available: isAvailable,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                document.getElementById('btnUpdate').disabled = true;
                document.getElementById('btnUpdate').textContent = '⏳ جاري الحفظ...';
                await menuCollection.doc(firebaseId).update(updatedData);
                resetForm();
                await loadMenuFromFirebase();
                showToast('✅ تم التعديل بنجاح!');
            } catch (error) {
                showToast('❌ فشل التعديل', 'error');
            } finally {
                document.getElementById('btnUpdate').disabled = false;
                document.getElementById('btnUpdate').textContent = '💾 حفظ التعديل';
            }
        }

        async function deleteItem(firebaseId) {
            if (!confirm('⚠️ هل أنت متأكد من حذف هذا الصنف؟')) return;
            try {
                await menuCollection.doc(firebaseId).delete();
                await loadMenuFromFirebase();
                showToast('🗑️ تم الحذف بنجاح!');
            } catch (error) {
                showToast('❌ فشل الحذف', 'error');
            }
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('itemCategory').value = 'وجبات رئيسية';
            document.getElementById('itemDescription').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemImage').value = '';
            isAvailable = true;
            document.getElementById('availabilityToggle').classList.add('active');
            document.getElementById('availabilityText').textContent = 'متوفر';
            document.getElementById('formTitle').textContent = '➕ إضافة صنف جديد';
            document.getElementById('btnAdd').style.display = 'block';
            document.getElementById('btnUpdate').style.display = 'none';
            document.getElementById('btnAdd').disabled = false;
            document.getElementById('btnAdd').textContent = '✅ إضافة';
            document.getElementById('btnUpdate').disabled = false;
            document.getElementById('btnUpdate').textContent = '💾 حفظ التعديل';
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            setTimeout(() => document.getElementById('passwordInput').focus(), 200);
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
        }

        function checkPassword() {
            if (document.getElementById('passwordInput').value === 'AHMed') {
                closePasswordModal();
                openAdminPanel();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function openAdminPanel() {
            document.getElementById('adminPanel').classList.add('active');
            displayAdminItems();
            document.body.style.overflow = 'hidden';
        }

        function closeAdminPanel() {
            document.getElementById('adminPanel').classList.remove('active');
            document.body.style.overflow = '';
            resetForm();
            loadMenuFromFirebase();
        }

        document.getElementById('passwordModal').addEventListener('click', function(e) {
            if (e.target === this) closePasswordModal();
        });

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        loadMenuFromFirebase();
    </script>
</body>
</html>
