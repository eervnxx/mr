<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #ff4757; --secondary: #ffa502; --accent: #2ed573;
            --dark: #1e1e2e; --glass: rgba(255,255,255,0.05);
            --glass-border: rgba(255,255,255,0.1); --text: #fff;
            --text-secondary: #b0b0c0; --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a35 50%, #0f0f25 100%);
            min-height: 100vh; color: var(--text); -webkit-tap-highlight-color: transparent;
        }

        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(14,14,30,0.85); backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 22px; font-weight: 800; }
        .logo span { background: linear-gradient(135deg, #ffa502, #ff6348); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-admin {
            background: linear-gradient(135deg, #ff4757, #ff6b81); color: white;
            border: none; padding: 10px 20px; border-radius: 30px;
            font-weight: 600; cursor: pointer; font-size: 14px;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px 15px 80px; }
        .hero { text-align: center; padding: 20px 0; }
        .hero h1 { font-size: clamp(28px, 6vw, 42px); font-weight: 900; }
        .hero h1 mark { background: linear-gradient(135deg, #ffa502, #ff6348); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search {
            width: 100%; max-width: 450px; margin: 15px auto; display: block;
            padding: 14px 20px; border-radius: 30px; background: var(--glass);
            border: 1px solid var(--glass-border); color: white; font-size: 15px; outline: none;
        }
        .search:focus { border-color: var(--primary); }

        .cats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
        .cat-btn {
            padding: 8px 18px; border-radius: 30px; background: var(--glass);
            border: 1px solid var(--glass-border); color: var(--text-secondary);
            cursor: pointer; font-size: 13px; transition: 0.3s;
        }
        .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
        .card {
            background: rgba(30,30,50,0.8); border: 1px solid var(--glass-border);
            border-radius: var(--radius); overflow: hidden; backdrop-filter: blur(20px);
            transition: 0.3s; animation: up 0.5s ease forwards; opacity: 0;
        }
        @keyframes up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .card:hover { transform: translateY(-6px); }
        .card img { width: 100%; height: 190px; object-fit: cover; }
        .card-body { padding: 14px; }
        .card h3 { font-size: 18px; margin-bottom: 4px; }
        .card p { color: var(--text-secondary); font-size: 12px; margin-bottom: 10px; }
        .card-foot { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 22px; font-weight: 800; color: var(--secondary); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-on { background: rgba(46,213,115,0.25); color: #7bed9f; }
        .badge-off { background: rgba(255,71,87,0.25); color: #ff6b81; }
        .card.off { opacity: 0.5; filter: grayscale(30%); }
        .empty { text-align: center; padding: 50px; color: var(--text-secondary); display: none; font-size: 18px; }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal.show { display: flex; }
        .modal-box {
            background: var(--dark); border: 1px solid var(--glass-border);
            padding: 30px 20px; border-radius: 24px; text-align: center; width: 90%; max-width: 370px;
        }
        .modal-box input {
            width: 100%; padding: 14px; border-radius: 12px; background: var(--glass);
            border: 1px solid var(--glass-border); color: white; text-align: center;
            font-size: 16px; margin-bottom: 10px; outline: none;
        }
        .modal-box button { width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; font-size: 14px; margin-top: 5px; }
        .btn-login { background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; }
        .btn-cancel { background: var(--glass); color: var(--text-secondary); border: 1px solid var(--glass-border); }
        .err { color: #ff4757; font-size: 13px; margin-top: 8px; display: none; }

        .admin {
            display: none; position: fixed; inset: 0; background: #16162a;
            z-index: 999; overflow-y: auto; padding: 12px;
        }
        .admin.show { display: block; }
        .admin-wrap { max-width: 700px; margin: 0 auto; }
        .admin-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; background: rgba(255,255,255,0.03);
            border-radius: 14px; margin-bottom: 14px; border: 1px solid var(--glass-border);
        }
        .admin-bar h3 { font-size: 17px; }
        .admin-bar button {
            background: rgba(255,71,87,0.25); color: var(--primary); border: none;
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600;
        }

        .form-box {
            background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 18px; margin-bottom: 14px;
        }
        .form-box h3 { margin-bottom: 14px; font-size: 15px; }
        .f-group { margin-bottom: 11px; }
        .f-group label {
            display: block; font-size: 11px; color: var(--text-secondary);
            margin-bottom: 4px; font-weight: 600; text-transform: uppercase;
        }
        .f-group input, .f-group select, .f-group textarea {
            width: 100%; padding: 12px; border-radius: 10px; background: var(--glass);
            border: 1px solid var(--glass-border); color: white; font-size: 14px;
            outline: none; font-family: inherit;
        }
        .f-group textarea { min-height: 65px; resize: vertical; }
        .f-group select option { background: #1e1e2e; }
        .f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .file-box {
            border: 2px dashed var(--glass-border); border-radius: 12px;
            padding: 24px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .file-box:hover { border-color: var(--primary); }
        .file-box.ok { border-color: var(--accent); border-style: solid; background: rgba(46,213,115,0.04); }
        .file-box .fico { font-size: 32px; }
        .file-box .ftxt { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .file-inp { display: none; }
        .preview { width: 100%; max-height: 170px; object-fit: cover; border-radius: 10px; margin-top: 10px; display: none; }
        .prog { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 8px; display: none; }
        .prog-fill { height: 100%; background: var(--primary); border-radius: 2px; width: 0%; transition: width 0.3s; }

        .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .btn { padding: 12px 18px; border-radius: 30px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; flex: 1; min-width: 85px; }
        .btn-add { background: var(--accent); color: #000; }
        .btn-save { background: var(--secondary); color: #000; }
        .btn-clr { background: var(--glass); color: var(--text-secondary); border: 1px solid var(--glass-border); }

        .list-head { display: grid; grid-template-columns: 40px 1fr 60px 80px; gap: 6px; padding: 10px 14px; font-size: 10px; color: var(--text-secondary); font-weight: 700; border-bottom: 1px solid var(--glass-border); text-transform: uppercase; }
        .list-row { display: grid; grid-template-columns: 40px 1fr 60px 80px; gap: 6px; padding: 10px 14px; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .list-row img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
        .list-row .linfo h4 { font-size: 12px; }
        .list-row .linfo span { font-size: 10px; color: var(--text-secondary); }
        .list-row .lprice { color: var(--secondary); font-weight: 700; font-size: 12px; }
        .lacts { display: flex; gap: 3px; }
        .btn-xs { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--glass-border); background: var(--glass); cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .btn-xs.ed { color: var(--secondary); border-color: rgba(255,165,2,0.3); }
        .btn-xs.dl { color: var(--primary); border-color: rgba(255,71,87,0.3); }

        .toast {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--dark); border: 1px solid var(--glass-border); padding: 12px 22px;
            border-radius: 40px; z-index: 2000; font-size: 13px; font-weight: 600;
            transition: transform 0.4s; pointer-events: none;
        }
        .toast.on { transform: translateX(-50%) translateY(0); }

        @media (max-width: 500px) {
            .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .card img { height: 130px; }
            .card h3 { font-size: 14px; }
            .price { font-size: 18px; }
            .f-row { grid-template-columns: 1fr; }
            .list-head, .list-row { grid-template-columns: 32px 1fr 50px 68px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">🍽️ مـ<span>نيو</span></div>
        <button class="btn-admin" onclick="openPassModal()">🔐 الإدارة</button>
    </header>

    <div class="container">
        <div class="hero"><h1>أشهى <mark>المأكولات</mark></h1></div>
        <input type="text" class="search" id="searchInput" placeholder="🔍 ابحث عن وجبتك..." oninput="showMenu()">
        <div class="cats" id="catBar"></div>
        <div class="grid" id="menuGrid"></div>
        <div class="empty" id="emptyMsg">🍽️ لا توجد أصناف</div>
    </div>

    <div class="modal" id="passModal">
        <div class="modal-box">
            <h2 style="margin-bottom:14px;">🔐 دخول المشرف</h2>
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <button class="btn-login" onclick="checkPass()">🚀 دخول</button>
            <button class="btn-cancel" onclick="closePassModal()">إلغاء</button>
            <p class="err" id="errMsg">❌ كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <div class="admin" id="adminPanel">
        <div class="admin-wrap">
            <div class="admin-bar"><h3>⚙️ لوحة التحكم</h3><button onclick="closeAdmin()">✖ إغلاق</button></div>
            
            <div class="form-box">
                <h3 id="formTitle">➕ إضافة صنف جديد</h3>
                <input type="hidden" id="editId">
                
                <div class="f-group">
                    <label>📸 صورة من الهاتف</label>
                    <div class="file-box" id="fileBox" onclick="document.getElementById('fileInput').click()">
                        <div class="fico">📁</div>
                        <div class="ftxt">اضغط لاختيار صورة من الاستديو</div>
                    </div>
                    <input type="file" class="file-inp" id="fileInput" accept="image/*" onchange="handleFile(event)">
                    <img class="preview" id="previewImg">
                    <div class="prog" id="progBar"><div class="prog-fill" id="progFill"></div></div>
                    <input type="hidden" id="itemImage">
                </div>
                
                <div class="f-group"><label>📝 اسم الصنف</label><input type="text" id="itemName" placeholder="مثال: برجر دجاج"></div>
                <div class="f-row">
                    <div class="f-group"><label>📂 التصنيف</label><select id="itemCat"><option>وجبات رئيسية</option><option>مقبلات</option><option>حلويات</option><option>مشروبات</option></select></div>
                    <div class="f-group"><label>💰 السعر</label><input type="number" id="itemPrice" placeholder="مثال: 25" step="0.01"></div>
                </div>
                <div class="f-group"><label>📄 الوصف</label><textarea id="itemDesc" placeholder="وصف مختصر..."></textarea></div>
                
                <div class="btn-row">
                    <button class="btn btn-add" id="btnAdd" onclick="addItem()">✅ إضافة</button>
                    <button class="btn btn-save" id="btnUpdate" style="display:none;" onclick="updateItem()">💾 حفظ التعديل</button>
                    <button class="btn btn-clr" onclick="resetForm()">🔄 جديد</button>
                </div>
            </div>
            
            <div class="form-box" style="padding:0;overflow:hidden;">
                <div class="list-head"><span>صورة</span><span>الاسم / التصنيف</span><span>السعر</span><span>تحكم</span></div>
                <div id="adminList"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== إعدادات Firebase ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDToxHcV5WBoW3TyMnjKOzdTn5_8nrxHcI",
            authDomain: "wevaz-e716b.firebaseapp.com",
            databaseURL: "https://wevaz-e716b-default-rtdb.firebaseio.com",
            projectId: "wevaz-e716b",
            storageBucket: "wevaz-e716b.firebasestorage.app",
            messagingSenderId: "11662784893",
            appId: "1:11662784893:web:24d284abd3096c2e873414",
            measurementId: "G-EVLFHWE125"
        };

        // مفتاح imgbb
        const IMGBB_KEY = "da3f49b21529668b440b1a7ac820fecf";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore().collection('menuItems');

        let items = [], cat = 'الكل', file = null;

        function toast(m) {
            const t = document.getElementById('toast');
            t.textContent = m; t.classList.add('on');
            clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2800);
        }

        async function uploadImg(f) {
            const pb = document.getElementById('progBar'), pf = document.getElementById('progFill');
            pb.style.display = 'block'; pf.style.width = '30%';
            const fd = new FormData(); fd.append('image', f);
            const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: fd });
            pf.style.width = '80%';
            const d = await r.json();
            if (d.success) { pf.style.width = '100%'; setTimeout(() => pb.style.display = 'none', 400); return d.data.url; }
            throw new Error('فشل');
        }

        function handleFile(e) {
            const f = e.target.files[0]; if (!f) return;
            if (!['image/jpeg','image/png','image/webp'].includes(f.type)) { toast('⚠️ نوع غير مدعوم'); return; }
            if (f.size > 5e6) { toast('⚠️ حجم كبير جداً'); return; }
            file = f;
            const r = new FileReader();
            r.onload = ev => {
                document.getElementById('previewImg').src = ev.target.result;
                document.getElementById('previewImg').style.display = 'block';
                const fb = document.getElementById('fileBox');
                fb.classList.add('ok'); fb.querySelector('.ftxt').textContent = f.name; fb.querySelector('.fico').textContent = '✅';
            };
            r.readAsDataURL(f);
        }

        async function loadData() {
            document.getElementById('menuGrid').innerHTML = '<div style="text-align:center;padding:30px;color:#999;">⏳ تحميل...</div>';
            const s = await db.orderBy('createdAt', 'desc').get();
            items = []; s.forEach(d => items.push({ fid: d.id, ...d.data() }));
            showMenu();
            if (document.getElementById('adminPanel').classList.contains('show')) showAdminList();
        }

        function showMenu() {
            const g = document.getElementById('menuGrid'), e = document.getElementById('emptyMsg');
            const b = document.getElementById('catBar'), q = document.getElementById('searchInput').value.toLowerCase();
            if (!items.length) { g.innerHTML = ''; e.style.display = 'block'; b.innerHTML = ''; return; }
            e.style.display = 'none';
            const cats = ['الكل', ...new Set(items.map(i => i.category || 'بدون'))];
            b.innerHTML = cats.map(c => `<button class="cat-btn ${c===cat?'active':''}" onclick="cat='${c}';showMenu();">${c}</button>`).join('');
            let f = items; if (cat !== 'الكل') f = f.filter(i => (i.category||'بدون') === cat);
            if (q) f = f.filter(i => (i.name||'').toLowerCase().includes(q) || (i.description||'').toLowerCase().includes(q));
            if (!f.length) { g.innerHTML = ''; e.style.display = 'block'; }
            else g.innerHTML = f.map((i,idx) => `<div class="card ${!i.available?'off':''}" style="animation-delay:${idx*0.05}s"><img src="${i.image||'https://placehold.co/400x200/1a1a35/666'}" onerror="this.src='https://placehold.co/400x200/1a1a35/666'"><div class="card-body"><h3>${i.name}</h3><p>${i.description||''}</p><div class="card-foot"><span class="price">${i.price||0} ريال</span><span class="badge ${i.available?'badge-on':'badge-off'}">${i.available?'متوفر':'غير متوفر'}</span></div></div></div>`).join('');
        }

        function showAdminList() {
            const c = document.getElementById('adminList');
            if (!items.length) { c.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">فارغ</div>'; return; }
            c.innerHTML = items.map(i => `<div class="list-row"><img src="${i.image||'https://placehold.co/36/333/666'}" onerror="this.src='https://placehold.co/36/333/666'"><div class="linfo"><h4>${i.name}</h4><span>${i.category||''} · ${i.available?'متوفر':'غير متوفر'}</span></div><div class="lprice">${i.price||0} ر.س</div><div class="lacts"><button class="btn-xs ed" onclick="editItem('${i.fid}')">✏️</button><button class="btn-xs dl" onclick="delItem('${i.fid}')">🗑️</button></div></div>`).join('');
        }

        async function addItem() {
            const n = document.getElementById('itemName').value.trim(), p = +document.getElementById('itemPrice').value;
            if (!n || isNaN(p)) { toast('⚠️ املأ الاسم والسعر'); return; }
            let img = '';
            if (file) {
                try {
                    document.getElementById('btnAdd').textContent = '⏳ رفع الصورة...';
                    document.getElementById('btnAdd').disabled = true;
                    img = await uploadImg(file);
                } catch { toast('❌ فشل رفع الصورة'); resetBtn(); return; }
            }
            try {
                document.getElementById('btnAdd').textContent = '⏳ حفظ...';
                await db.add({
                    name: n, category: document.getElementById('itemCat').value,
                    description: document.getElementById('itemDesc').value.trim() || 'لا يوجد وصف',
                    price: p, image: img || 'https://placehold.co/400x200/1a1a35/666',
                    available: true, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                resetForm(); await loadData(); toast('✅ تمت الإضافة!');
            } catch { toast('❌ فشل'); }
            resetBtn();
        }
        function resetBtn() { document.getElementById('btnAdd').textContent = '✅ إضافة'; document.getElementById('btnAdd').disabled = false; }

        function editItem(fid) {
            const i = items.find(x => x.fid === fid); if (!i) return;
            document.getElementById('editId').value = fid;
            document.getElementById('itemName').value = i.name || '';
            document.getElementById('itemCat').value = i.category || 'وجبات رئيسية';
            document.getElementById('itemDesc').value = i.description || '';
            document.getElementById('itemPrice').value = i.price || '';
            if (i.image && i.image.startsWith('http')) {
                document.getElementById('previewImg').src = i.image;
                document.getElementById('previewImg').style.display = 'block';
            }
            file = null;
            document.getElementById('formTitle').textContent = '✏️ تعديل: ' + i.name;
            document.getElementById('btnAdd').style.display = 'none';
            document.getElementById('btnUpdate').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function updateItem() {
            const fid = document.getElementById('editId').value; if (!fid) return;
            const n = document.getElementById('itemName').value.trim(), p = +document.getElementById('itemPrice').value;
            if (!n || isNaN(p)) { toast('⚠️ املأ الاسم والسعر'); return; }
            let img = document.getElementById('previewImg').src;
            if (file) {
                try {
                    document.getElementById('btnUpdate').textContent = '⏳ رفع...';
                    document.getElementById('btnUpdate').disabled = true;
                    img = await uploadImg(file);
                } catch { toast('❌ فشل رفع الصورة'); resetUpdateBtn(); return; }
            }
            try {
                document.getElementById('btnUpdate').textContent = '⏳ حفظ...';
                await db.doc(fid).update({
                    name: n, category: document.getElementById('itemCat').value,
                    description: document.getElementById('itemDesc').value.trim() || 'لا يوجد وصف',
                    price: p, image: img || 'https://placehold.co/400x200/1a1a35/666',
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                resetForm(); await loadData(); toast('✅ تم التعديل!');
            } catch { toast('❌ فشل'); }
            resetUpdateBtn();
        }
        function resetUpdateBtn() { document.getElementById('btnUpdate').textContent = '💾 حفظ'; document.getElementById('btnUpdate').disabled = false; }

        async function delItem(fid) {
            if (!confirm('⚠️ متأكد من الحذف؟')) return;
            try { await db.doc(fid).delete(); await loadData(); toast('🗑️ تم الحذف'); } catch { toast('❌ فشل'); }
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('itemCat').value = 'وجبات رئيسية';
            document.getElementById('itemDesc').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('previewImg').style.display = 'none';
            document.getElementById('fileInput').value = '';
            document.getElementById('progBar').style.display = 'none';
            file = null;
            const fb = document.getElementById('fileBox');
            fb.classList.remove('ok'); fb.querySelector('.ftxt').textContent = 'اضغط لاختيار صورة من الاستديو'; fb.querySelector('.fico').textContent = '📁';
            document.getElementById('formTitle').textContent = '➕ إضافة صنف جديد';
            document.getElementById('btnAdd').style.display = 'block';
            document.getElementById('btnUpdate').style.display = 'none';
            resetBtn(); resetUpdateBtn();
        }

        function openPassModal() { document.getElementById('passModal').classList.add('show'); document.getElementById('passInput').value = ''; document.getElementById('errMsg').style.display = 'none'; setTimeout(() => document.getElementById('passInput').focus(), 200); }
        function closePassModal() { document.getElementById('passModal').classList.remove('show'); }
        function checkPass() {
            if (document.getElementById('passInput').value === 'AHMed') {
                closePassModal();
                document.getElementById('adminPanel').classList.add('show');
                showAdminList();
                document.body.style.overflow = 'hidden';
            } else { document.getElementById('errMsg').style.display = 'block'; }
        }
        function closeAdmin() { document.getElementById('adminPanel').classList.remove('show'); document.body.style.overflow = ''; resetForm(); loadData(); }

        document.getElementById('passModal').addEventListener('click', function(e) { if (e.target === this) closePassModal(); });
        document.getElementById('passInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkPass(); });

        loadData();
    </script>
</body>
</html>
