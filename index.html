<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAVES | ويڤز</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg: #0a0a14; --bg2: #12122a;
            --surface: rgba(20,20,45,0.9); --surface2: rgba(255,255,255,0.02);
            --glass: rgba(255,255,255,0.04); --glass-border: rgba(255,255,255,0.08);
            --text: #ffffff; --text2: #9494b8;
            --primary: #4a90d9; --primary2: #7ab8f5; --secondary: #fd79a8; --accent: #00cec9;
            --gradient1: linear-gradient(135deg, #4a90d9, #7ab8f5);
            --gradient2: linear-gradient(135deg, #fd79a8, #e84393);
            --gradient-blue: linear-gradient(135deg, #7ab8f5, #1a56db);
            --header-bg: rgba(10,10,20,0.85); --card-bg: rgba(20,20,45,0.8);
            --input-bg: rgba(255,255,255,0.04); --shadow: 0 20px 50px rgba(0,0,0,0.5);
            --shadow-card: 0 8px 32px rgba(0,0,0,0.3); --radius: 20px; --radius-sm: 12px;
            --font-ar: 'Cairo', sans-serif; --font-en: 'Poppins', sans-serif;
        }

        .light-mode {
            --bg: #f5f6fa; --bg2: #ffffff; --surface: rgba(255,255,255,0.95);
            --surface2: rgba(0,0,0,0.015); --glass: rgba(0,0,0,0.03);
            --glass-border: rgba(0,0,0,0.08); --text: #1a1a2e; --text2: #6b6b80;
            --primary: #3b7dd8; --primary2: #5a9ef5; --secondary: #e85d9a; --accent: #00b894;
            --header-bg: rgba(255,255,255,0.9); --card-bg: rgba(255,255,255,0.95);
            --input-bg: rgba(0,0,0,0.025); --shadow: 0 10px 40px rgba(0,0,0,0.06);
            --shadow-card: 0 4px 20px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-ar);
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 20% 0%, rgba(74,144,217,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(253,121,168,0.1) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(0,206,201,0.05) 0%, transparent 70%);
            min-height: 100vh; color: var(--text);
            -webkit-tap-highlight-color: transparent;
            transition: background 0.5s, color 0.5s; overflow-x: hidden;
        }

        .bg-orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; z-index: 0; animation: orbFloat 20s ease-in-out infinite; }
        .bg-orb.orb1 { width: 500px; height: 500px; background: var(--primary); top: -10%; left: -10%; }
        .bg-orb.orb2 { width: 400px; height: 400px; background: var(--secondary); bottom: -10%; right: -5%; animation-delay: -7s; }
        .bg-orb.orb3 { width: 300px; height: 300px; background: var(--accent); top: 50%; left: 40%; animation-delay: -14s; }
        @keyframes orbFloat { 0%,100% { transform: translate(0,0) scale(1); } 25% { transform: translate(40px,-30px) scale(1.1); } 50% { transform: translate(-20px,20px) scale(0.9); } 75% { transform: translate(-30px,-20px) scale(1.05); } }

        .header {
            position: sticky; top: 0; z-index: 100; background: var(--header-bg);
            backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-bottom: 1px solid var(--glass-border); padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center; transition: 0.4s;
        }
        .brand { display: flex; align-items: center; gap: 6px; }
        .brand-text {
            font-size: 26px; font-weight: 900; letter-spacing: -0.5px; font-family: var(--font-en);
            background: var(--gradient1); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-sub { font-size: 10px; color: var(--text2); font-weight: 400; letter-spacing: 2px; text-transform: uppercase; font-family: var(--font-en); }
        .header-actions { display: flex; gap: 8px; align-items: center; }

        .btn-settings {
            width: 44px; height: 44px; border-radius: 14px; background: var(--glass);
            border: 1px solid var(--glass-border); color: var(--text); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .btn-settings:hover { background: rgba(128,128,128,0.2); transform: translateY(-3px); box-shadow: var(--shadow-card); }
        .btn-settings svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .container { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; padding: 20px 16px 80px; }

        .hero { text-align: center; padding: 50px 20px 30px; position: relative; }
        .hero-badge {
            display: inline-block; padding: 8px 20px; border-radius: 50px;
            background: var(--glass); border: 1px solid var(--glass-border);
            font-size: 12px; font-weight: 600; color: var(--primary2);
            margin-bottom: 24px; letter-spacing: 2px; text-transform: uppercase;
            font-family: var(--font-en); backdrop-filter: blur(20px);
        }
        .hero h1 {
            font-size: clamp(50px, 10vw, 90px); font-weight: 900; line-height: 1;
            font-family: var(--font-ar); letter-spacing: -1px; margin-bottom: 8px;
        }
        .hero h1 .wavz-text {
            background: linear-gradient(180deg, #b8d9ff 0%, #7ab8f5 30%, #3b7dd8 60%, #1a3d7a 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 8px 40px rgba(26,61,122,0.5), 0 2px 8px rgba(0,0,0,0.6);
            filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));
            display: inline-block;
        }
        .hero p { font-size: clamp(14px, 3vw, 18px); color: var(--text2); font-weight: 300; max-width: 500px; margin: 0 auto; }

        .search-wrapper { position: relative; max-width: 520px; margin: 10px auto 25px; }
        .search {
            width: 100%; padding: 16px 24px; border-radius: 50px; background: var(--input-bg);
            border: 2px solid var(--glass-border); color: var(--text); font-size: 15px;
            outline: none; transition: 0.3s; font-family: var(--font-ar); backdrop-filter: blur(20px);
        }
        .search::placeholder { color: var(--text2); }
        .search:focus { border-color: var(--primary); box-shadow: 0 0 0 6px rgba(74,144,217,0.1); }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 18px; pointer-events: none; }

        .cats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
        .cat-btn {
            padding: 10px 22px; border-radius: 50px; background: var(--glass);
            border: 1px solid var(--glass-border); color: var(--text2);
            cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.3s;
            backdrop-filter: blur(20px); font-family: var(--font-ar);
        }
        .cat-btn:hover { background: rgba(74,144,217,0.15); color: var(--text); transform: translateY(-2px); }
        .cat-btn.active { background: var(--gradient1); color: white; border-color: transparent; box-shadow: 0 6px 20px rgba(74,144,217,0.3); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
        .card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: var(--radius); overflow: hidden; backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardUp 0.6s ease forwards; opacity: 0; box-shadow: var(--shadow-card); position: relative;
        }
        @keyframes cardUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .card:hover { transform: translateY(-10px); box-shadow: 0 24px 48px rgba(0,0,0,0.2); border-color: rgba(74,144,217,0.3); }
        .card-img-wrap { position: relative; width: 100%; height: 210px; overflow: hidden; }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .card:hover img { transform: scale(1.08); }
        .card-img-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to top, var(--card-bg), transparent); }
        .card-badge { position: absolute; top: 14px; right: 14px; padding: 6px 14px; border-radius: 50px; font-size: 11px; font-weight: 700; backdrop-filter: blur(20px); letter-spacing: 0.5px; font-family: var(--font-en); }
        .badge-on { background: rgba(0,206,201,0.25); color: #00cec9; border: 1px solid rgba(0,206,201,0.3); }
        .badge-off { background: rgba(253,121,168,0.25); color: #fd79a8; border: 1px solid rgba(253,121,168,0.3); }
        .card-cat { position: absolute; top: 14px; left: 14px; padding: 5px 12px; border-radius: 50px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); font-size: 10px; color: rgba(255,255,255,0.8); font-weight: 500; }
        .card-body { padding: 18px; }
        .card h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px; }
        .card p { color: var(--text2); font-size: 13px; margin-bottom: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-foot { display: flex; justify-content: space-between; align-items: center; }
        .price { font-size: 26px; font-weight: 800; font-family: var(--font-en); }
        .price-gradient { background: var(--gradient2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card.off { opacity: 0.45; filter: grayscale(30%); }
        .card.off:hover { opacity: 0.7; }

        .empty { text-align: center; padding: 60px; color: var(--text2); display: none; font-size: 18px; }
        .empty-icon { font-size: 60px; margin-bottom: 16px; opacity: 0.6; }

        .settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 1100; justify-content: center; align-items: center; }
        .settings-modal.show { display: flex; }
        .settings-box { background: var(--surface); border: 1px solid var(--glass-border); padding: 28px 24px; border-radius: 28px; width: 92%; max-width: 420px; box-shadow: var(--shadow); animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(40px); }
        @keyframes pop { from { transform: scale(0.85) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        .settings-box h3 { margin-bottom: 24px; font-size: 20px; text-align: center; font-weight: 700; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--glass-border); }
        .setting-row:last-child { border-bottom: none; }
        .setting-row span { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .setting-row select { padding: 10px 16px; border-radius: 12px; background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text); font-size: 13px; outline: none; cursor: pointer; font-family: inherit; }
        .setting-row select option { background: var(--bg2); color: var(--text); }
        .toggle-sw { width: 54px; height: 30px; background: var(--glass); border-radius: 50px; cursor: pointer; position: relative; border: 1px solid var(--glass-border); transition: 0.3s; }
        .toggle-sw.on { background: var(--primary); border-color: var(--primary); }
        .toggle-sw::after { content: ''; position: absolute; width: 24px; height: 24px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .toggle-sw.on::after { left: 26px; }
        .btn-admin-link { width: 100%; padding: 16px; border-radius: 16px; background: var(--gradient1); color: white; border: none; cursor: pointer; font-weight: 700; font-size: 15px; margin-top: 20px; transition: 0.3s; font-family: var(--font-ar); box-shadow: 0 8px 24px rgba(74,144,217,0.3); }
        .btn-admin-link:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(74,144,217,0.4); }
        .btn-close-settings { width: 100%; padding: 14px; border-radius: 16px; background: var(--glass); color: var(--text2); border: 1px solid var(--glass-border); cursor: pointer; font-weight: 600; font-size: 14px; margin-top: 10px; transition: 0.3s; }

        .pass-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 1200; justify-content: center; align-items: center; }
        .pass-modal.show { display: flex; }
        .pass-box { background: var(--surface); border: 1px solid var(--glass-border); padding: 35px 24px; border-radius: 28px; text-align: center; width: 92%; max-width: 420px; box-shadow: var(--shadow); animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); backdrop-filter: blur(40px); }
        .pass-box .lock-icon { font-size: 48px; margin-bottom: 12px; }
        .pass-box h2 { margin-bottom: 18px; font-size: 20px; font-weight: 700; }
        .pass-box input {
            width: 100%; padding: 16px; border-radius: 14px; background: var(--input-bg);
            border: 2px solid var(--glass-border); color: var(--text); text-align: center;
            font-size: 16px; margin-bottom: 10px; outline: none; font-family: inherit; transition: 0.3s;
        }
        .pass-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 6px rgba(74,144,217,0.08); }
        .pass-box button { width: 100%; padding: 16px; border-radius: 14px; border: none; cursor: pointer; font-weight: 700; font-size: 15px; margin-top: 6px; transition: 0.3s; font-family: var(--font-ar); }
        .btn-login { background: var(--gradient1); color: white; box-shadow: 0 6px 20px rgba(74,144,217,0.3); }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(74,144,217,0.4); }
        .btn-cancel { background: var(--glass); color: var(--text2); border: 1px solid var(--glass-border); }
        .err { color: #fd79a8; font-size: 13px; margin-top: 10px; display: none; font-weight: 500; }

        .admin { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 999; overflow-y: auto; padding: 12px; }
        .admin.show { display: block; }
        .admin-wrap { max-width: 750px; margin: 0 auto; }
        .admin-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--surface2); border-radius: var(--radius); margin-bottom: 16px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); }
        .admin-bar h3 { font-size: 18px; font-weight: 700; }
        .admin-bar button { background: rgba(253,121,168,0.2); color: var(--secondary); border: none; padding: 10px 18px; border-radius: 14px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .admin-bar button:hover { background: rgba(253,121,168,0.35); }
        .form-box { background: var(--surface2); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; backdrop-filter: blur(20px); }
        .form-box h3 { margin-bottom: 16px; font-size: 16px; font-weight: 700; }
        .f-group { margin-bottom: 12px; }
        .f-group label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .f-group input, .f-group select, .f-group textarea { width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text); font-size: 14px; outline: none; font-family: inherit; transition: 0.3s; }
        .f-group input:focus, .f-group select:focus, .f-group textarea:focus { border-color: var(--primary); }
        .f-group textarea { min-height: 70px; resize: vertical; }
        .f-group select option { background: var(--bg2); color: var(--text); }
        .f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .file-box { border: 2px dashed var(--glass-border); border-radius: var(--radius-sm); padding: 28px; text-align: center; cursor: pointer; transition: 0.3s; }
        .file-box:hover { border-color: var(--primary); background: rgba(74,144,217,0.04); }
        .file-box.ok { border-color: var(--accent); border-style: solid; background: rgba(0,206,201,0.04); }
        .file-box .fico { font-size: 36px; }
        .file-box .ftxt { font-size: 13px; color: var(--text2); margin-top: 6px; }
        .file-inp { display: none; }
        .preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: var(--radius-sm); margin-top: 12px; display: none; }
        .prog { width: 100%; height: 5px; background: rgba(128,128,128,0.15); border-radius: 3px; margin-top: 10px; display: none; overflow: hidden; }
        .prog-fill { height: 100%; background: var(--gradient1); border-radius: 3px; width: 0%; transition: width 0.3s; }
        .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
        .btn { padding: 14px 22px; border-radius: 14px; border: none; cursor: pointer; font-weight: 700; font-size: 14px; flex: 1; min-width: 90px; transition: 0.3s; }
        .btn-add { background: var(--accent); color: #000; }
        .btn-add:hover { box-shadow: 0 6px 20px rgba(0,206,201,0.3); transform: translateY(-2px); }
        .btn-save { background: var(--secondary); color: white; }
        .btn-save:hover { box-shadow: 0 6px 20px rgba(253,121,168,0.3); transform: translateY(-2px); }
        .btn-clr { background: var(--glass); color: var(--text2); border: 1px solid var(--glass-border); }
        .list-head { display: grid; grid-template-columns: 45px 1fr 65px 85px; gap: 8px; padding: 12px 16px; font-size: 10px; color: var(--text2); font-weight: 700; border-bottom: 1px solid var(--glass-border); text-transform: uppercase; letter-spacing: 1px; }
        .list-row { display: grid; grid-template-columns: 45px 1fr 65px 85px; gap: 8px; padding: 12px 16px; align-items: center; border-bottom: 1px solid rgba(128,128,128,0.06); transition: 0.2s; }
        .list-row:hover { background: rgba(128,128,128,0.03); }
        .list-row img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
        .list-row .linfo h4 { font-size: 13px; font-weight: 600; }
        .list-row .linfo span { font-size: 10px; color: var(--text2); }
        .list-row .lprice { color: var(--primary2); font-weight: 700; font-size: 13px; }
        .lacts { display: flex; gap: 4px; }
        .btn-xs { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--glass-border); background: var(--glass); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-xs:hover { transform: scale(1.1); }
        .btn-xs.ed { color: var(--secondary); border-color: rgba(253,121,168,0.3); background: rgba(253,121,168,0.08); }
        .btn-xs.dl { color: #fd79a8; border-color: rgba(253,121,168,0.3); background: rgba(253,121,168,0.08); }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--surface); border: 1px solid var(--glass-border); padding: 14px 26px; border-radius: 50px; z-index: 2000; font-size: 14px; font-weight: 600; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: var(--shadow); pointer-events: none; color: var(--text); backdrop-filter: blur(20px); font-family: var(--font-ar); }
        .toast.on { transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .card-img-wrap { height: 150px; }
            .card-body { padding: 12px; }
            .card h3 { font-size: 15px; }
            .price { font-size: 20px; }
            .f-row { grid-template-columns: 1fr; }
            .list-head, .list-row { grid-template-columns: 35px 1fr 55px 70px; font-size: 9px; }
            .hero h1 { font-size: 48px; }
            .brand-text { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>

    <header class="header">
        <div class="brand">
            <div class="brand-text">WAVES</div>
            <div class="brand-sub">Restaurant</div>
        </div>
        <div class="header-actions">
            <button class="btn-settings" onclick="openSettings()" title="Settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
            </button>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <div class="hero-badge">✦ Premium Quality</div>
            <h1><span class="wavz-text">ويڤز</span></h1>
            <p data-lang="heroSub">أشهى المأكولات المحضرة بعناية فائقة</p>
        </div>

        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" class="search" id="searchInput" data-lang-placeholder="search" placeholder="ابحث عن وجبتك المفضلة..." oninput="showMenu()">
        </div>

        <div class="cats" id="catBar"></div>
        <div class="grid" id="menuGrid"></div>
        <div class="empty" id="emptyMsg"><div class="empty-icon">🍽️</div><span data-lang="empty">لا توجد أصناف متاحة</span></div>
    </div>

    <div class="settings-modal" id="settingsModal">
        <div class="settings-box">
            <h3 data-lang="settings">⚙️ الإعدادات</h3>
            <div class="setting-row"><span data-lang="darkmode">🌙 الوضع الليلي</span><div class="toggle-sw on" id="darkToggle" onclick="toggleDarkMode()"></div></div>
            <div class="setting-row"><span data-lang="language">🌐 اللغة</span>
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="ku">🏳️ کوردی</option>
                </select>
            </div>
            <button class="btn-admin-link" onclick="openPassFromSettings()" data-lang="adminBtn">🔐 لوحة تحكم الإدارة</button>
            <button class="btn-close-settings" onclick="closeSettings()" data-lang="close">إغلاق</button>
        </div>
    </div>

    <div class="pass-modal" id="passModal">
        <div class="pass-box">
            <div class="lock-icon">🔐</div>
            <h2 data-lang="passTitle">دخول المشرف</h2>
            <input type="email" id="emailInput" placeholder="البريد الإلكتروني">
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <button class="btn-login" onclick="checkPass()" data-lang="loginBtn">🚀 دخول</button>
            <button class="btn-cancel" onclick="closePassModal()" data-lang="cancel">إلغاء</button>
            <p class="err" id="errMsg" data-lang="wrongPass">❌ البريد الإلكتروني أو كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <div class="admin" id="adminPanel">
        <div class="admin-wrap">
            <div class="admin-bar"><h3>⚙️ لوحة التحكم</h3><button onclick="closeAdmin()">✖ إغلاق</button></div>
            <div class="form-box">
                <h3 id="formTitle" data-lang="formTitle">➕ إضافة صنف جديد</h3>
                <input type="hidden" id="editId">
                <div class="f-group"><label data-lang="imgLabel">📸 صورة من الهاتف</label>
                    <div class="file-box" id="fileBox" onclick="document.getElementById('fileInput').click()">
                        <div class="fico">📁</div><div class="ftxt" data-lang="uploadText">اضغط لاختيار صورة من الاستديو</div>
                    </div>
                    <input type="file" class="file-inp" id="fileInput" accept="image/*" onchange="handleFile(event)">
                    <img class="preview" id="previewImg">
                    <div class="prog" id="progBar"><div class="prog-fill" id="progFill"></div></div>
                </div>
                <div class="f-group"><label data-lang="nameLabel">📝 اسم الصنف</label><input type="text" id="itemName" placeholder="برجر دجاج"></div>
                <div class="f-row">
                    <div class="f-group"><label data-lang="catLabel">📂 تصنيف</label><select id="itemCat"><option>وجبات سريعة</option><option>اراكيل</option><option>حلويات</option><option>عصائر طبيعية</option><option>مشروبات باردة </option><option>مشروبات ساخنه</option><option>مقبلات </option><option>بيتزا </option><option>بركر </option><option>ريزو </option><option>ايس كريم </option><option>كوكتيلات </option><option>موهيتو </option><option>فرابتشينو </option><option>ميلك شيلك </option></select></div>
                    <div class="f-group"><label data-lang="priceLabel">💰 سعر</label><input type="number" id="itemPrice" placeholder="25" step="0.01"></div>
                </div>
                <div class="f-group"><label data-lang="descLabel">📄 وصف</label><textarea id="itemDesc" placeholder="وصف مختصر..."></textarea></div>
                <div class="btn-row">
                    <button class="btn btn-add" id="btnAdd" onclick="addItem()" data-lang="addBtn">✅ إضافة</button>
                    <button class="btn btn-save" id="btnUpdate" style="display:none;" onclick="updateItem()" data-lang="saveBtn">💾 حفظ</button>
                    <button class="btn btn-clr" onclick="resetForm()" data-lang="resetBtn">🔄 جديد</button>
                </div>
            </div>
            <div class="form-box" style="padding:0;overflow:hidden;">
                <div class="list-head"><span>صورة</span><span>الاسم</span><span>سعر</span><span>تحكم</span></div>
                <div id="adminList"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const translations = {
            ar: { heroSub: 'أشهى المأكولات المحضرة بعناية فائقة', search: 'ابحث عن وجبتك المفضلة...', all: 'الكل', categories: ['وجبات رئيسية','مقبلات','حلويات','مشروبات'], empty: 'لا توجد أصناف متاحة', available: 'متوفر', unavailable: 'غير متوفر', currency: 'دينار', settings: '⚙️ الإعدادات', darkmode: '🌙 الوضع الليلي', language: '🌐 اللغة', adminBtn: '🔐 لوحة تحكم الإدارة', close: 'إغلاق', passTitle: 'دخول المشرف', loginBtn: '🚀 دخول', cancel: 'إلغاء', wrongPass: '❌ البريد أو كلمة المرور غير صحيحة', formTitle: '➕ إضافة صنف جديد', formTitleEdit: '✏️ تعديل: ', uploadText: 'اضغط لاختيار صورة من الاستديو', nameLabel: '📝 اسم الصنف', catLabel: '📂 تصنيف', priceLabel: '💰 سعر', descLabel: '📄 وصف', addBtn: '✅ إضافة', saveBtn: '💾 حفظ', resetBtn: '🔄 جديد', loading: '⏳ تحميل...', toastAdded: '✅ تمت الإضافة بنجاح!', toastUpdated: '✅ تم التعديل بنجاح!', toastDeleted: '🗑️ تم الحذف!', toastError: '❌ فشل', toastFill: '⚠️ املأ الاسم والسعر', toastImgFail: '❌ فشل رفع الصورة', toastImgType: '⚠️ نوع غير مدعوم', toastImgSize: '⚠️ حجم كبير جداً', confirmDel: '⚠️ متأكد من الحذف؟', noItems: 'فارغ', imgLabel: '📸 صورة من الهاتف' },
            en: { heroSub: 'Finest cuisine crafted with care', search: 'Search for your favorite meal...', all: 'All', categories: ['Main Dishes','Appetizers','Desserts','Drinks'], empty: 'No items available', available: 'Available', unavailable: 'Unavailable', currency: 'd', settings: '⚙️ Settings', darkmode: '🌙 Dark Mode', language: '🌐 Language', adminBtn: '🔐 Admin Panel', close: 'Close', passTitle: 'Admin Login', loginBtn: '🚀 Login', cancel: 'Cancel', wrongPass: '❌ Wrong email or password', formTitle: '➕ Add New Item', formTitleEdit: '✏️ Edit: ', uploadText: 'Tap to choose from gallery', nameLabel: '📝 Item Name', catLabel: '📂 Category', priceLabel: '💰 Price', descLabel: '📄 Description', addBtn: '✅ Add', saveBtn: '💾 Save', resetBtn: '🔄 Reset', loading: '⏳ Loading...', toastAdded: '✅ Added successfully!', toastUpdated: '✅ Updated successfully!', toastDeleted: '🗑️ Deleted!', toastError: '❌ Failed', toastFill: '⚠️ Fill name and price', toastImgFail: '❌ Upload failed', toastImgType: '⚠️ Unsupported type', toastImgSize: '⚠️ File too large', confirmDel: '⚠️ Sure to delete?', noItems: 'Empty', imgLabel: '📸 Image from phone' },
            ku: { heroSub: 'خۆشترین خواردنەکان بە وردی ئامادەکراون', search: 'بگەڕێ بۆ خواردنی دڵخوازت...', all: 'هەموو', categories: ['ژەمە سەرەکییەکان','پێشخواردن','شیرینی','خواردنەوە'], empty: 'هیچ خواردنێک نییە', available: 'بەردەستە', unavailable: 'بەردەست نییە', currency: 'ریال', settings: '⚙️ ڕێکخستنەکان', darkmode: '🌙 شەوانە', language: '🌐 زمان', adminBtn: '🔐 پانێڵی بەڕێوەبردن', close: 'داخستن', passTitle: 'چوونەژوورەوە', loginBtn: '🚀 چوونەژوور', cancel: 'پاشگەزبوونەوە', wrongPass: '❌ ئیمەیڵ یان وشەی نهێنی هەڵەیە', formTitle: '➕ زیادکردنی خواردن', formTitleEdit: '✏️ دەستکاری: ', uploadText: 'پەنجە بنێ بۆ هەڵبژاردنی وێنە', nameLabel: '📝 ناوی خواردن', catLabel: '📂 جۆر', priceLabel: '💰 نرخ', descLabel: '📄 پێناسە', addBtn: '✅ زیادکردن', saveBtn: '💾 پاشەکەوت', resetBtn: '🔄 نوێ', loading: '⏳ بارکردن...', toastAdded: '✅ زیادکرا!', toastUpdated: '✅ نوێکرایەوە!', toastDeleted: '🗑️ سڕایەوە!', toastError: '❌ شکستی هێنا', toastFill: '⚠️ ناو و نرخ پڕبکە', toastImgFail: '❌ بارکردنی وێنە شکستی هێنا', toastImgType: '⚠️ جۆری پشتگیری نەکراو', toastImgSize: '⚠️ قەبارەی فایل زۆر گەورەیە', confirmDel: '⚠️ دڵنیایت دەتەوێت بیسڕیتەوە؟', noItems: 'بەتاڵ', imgLabel: '📸 وێنە لە مۆبایل' }
        };

        let currentLang = localStorage.getItem('menuLang') || 'ar';
        let isDark = localStorage.getItem('menuDark') !== 'false';

        function t(key) { return translations[currentLang]?.[key] || translations.ar[key] || key; }

        const firebaseConfig = {
            apiKey: "AIzaSyDToxHcV5WBoW3TyMnjKOzdTn5_8nrxHcI",
            authDomain: "wevaz-e716b.firebaseapp.com",
            databaseURL: "https://wevaz-e716b-default-rtdb.firebaseio.com",
            projectId: "wevaz-e716b",
            storageBucket: "wevaz-e716b.firebasestorage.app",
            messagingSenderId: "11662784893",
            appId: "1:11662784893:web:24d284abd3096c2e873414"
        };
        const IMGBB_KEY = "da3f49b21529668b440b1a7ac820fecf";
        const ADMIN_EMAIL = "WAVEZ.ahmEd@gmail.com";
        const ADMIN_PASS = "Wavez5";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore().collection('menuItems');

        let items = [], cat = 'الكل', file = null;

        function applyDarkMode() {
            if (isDark) { document.body.classList.remove('light-mode'); document.getElementById('darkToggle').classList.add('on'); }
            else { document.body.classList.add('light-mode'); document.getElementById('darkToggle').classList.remove('on'); }
            localStorage.setItem('menuDark', isDark);
        }
        function toggleDarkMode() { isDark = !isDark; applyDarkMode(); }

        function changeLanguage(lang) {
            currentLang = lang; localStorage.setItem('menuLang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' || lang === 'ku' ? 'rtl' : 'ltr';
            document.body.style.fontFamily = lang === 'en' ? 'var(--font-en)' : 'var(--font-ar)';
            updateUITexts(); showMenu();
            if (document.getElementById('adminPanel').classList.contains('show')) showAdminList();
        }

        function updateUITexts() {
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (el.hasAttribute('data-lang-placeholder')) el.placeholder = t(el.getAttribute('data-lang-placeholder'));
                else if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') el.textContent = t(key);
            });
            document.getElementById('langSelect').value = currentLang;
        }

        function openSettings() { document.getElementById('settingsModal').classList.add('show'); document.getElementById('langSelect').value = currentLang; updateUITexts(); }
        function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }
        function openPassFromSettings() { closeSettings(); document.getElementById('passModal').classList.add('show'); document.getElementById('emailInput').value = ''; document.getElementById('passInput').value = ''; document.getElementById('errMsg').style.display = 'none'; setTimeout(() => document.getElementById('emailInput').focus(), 200); }

        function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2800); }

        async function uploadImg(f) {
            const pb = document.getElementById('progBar'), pf = document.getElementById('progFill');
            pb.style.display = 'block'; pf.style.width = '30%';
            const fd = new FormData(); fd.append('image', f);
            const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: fd });
            pf.style.width = '80%'; const d = await r.json();
            if (d.success) { pf.style.width = '100%'; setTimeout(() => pb.style.display = 'none', 400); return d.data.url; }
            throw new Error('فشل');
        }

        function handleFile(e) {
            const f = e.target.files[0]; if (!f) return;
            if (!['image/jpeg','image/png','image/webp'].includes(f.type)) { toast(t('toastImgType')); return; }
            if (f.size > 5e6) { toast(t('toastImgSize')); return; }
            file = f; const r = new FileReader();
            r.onload = ev => {
                document.getElementById('previewImg').src = ev.target.result;
                document.getElementById('previewImg').style.display = 'block';
                const fb = document.getElementById('fileBox');
                fb.classList.add('ok'); fb.querySelector('.ftxt').textContent = f.name; fb.querySelector('.fico').textContent = '✅';
            };
            r.readAsDataURL(f);
        }

        async function loadData() {
            document.getElementById('menuGrid').innerHTML = `<div style="text-align:center;padding:40px;color:var(--text2);">${t('loading')}</div>`;
            const s = await db.orderBy('createdAt', 'desc').get();
            items = []; s.forEach(d => items.push({ fid: d.id, ...d.data() }));
            showMenu(); if (document.getElementById('adminPanel').classList.contains('show')) showAdminList();
        }

        function showMenu() {
            const g = document.getElementById('menuGrid'), e = document.getElementById('emptyMsg');
            const b = document.getElementById('catBar'), q = document.getElementById('searchInput').value.toLowerCase();
            if (!items.length) { g.innerHTML = ''; e.style.display = 'block'; b.innerHTML = ''; return; }
            e.style.display = 'none';
            const allCats = [t('all'), ...new Set(items.map(i => i.category || 'بدون'))];
            b.innerHTML = allCats.map(c => `<button class="cat-btn ${c===cat?'active':''}" onclick="cat='${c}';showMenu();">${c}</button>`).join('');
            let f = items; if (cat !== t('all')) f = f.filter(i => (i.category||'بدون') === cat);
            if (q) f = f.filter(i => (i.name||'').toLowerCase().includes(q) || (i.description||'').toLowerCase().includes(q));
            if (!f.length) { g.innerHTML = ''; e.style.display = 'block'; }
            else g.innerHTML = f.map((i,idx) => `<div class="card ${!i.available?'off':''}" style="animation-delay:${idx*0.06}s"><div class="card-img-wrap"><img src="${i.image||'https://placehold.co/400x250/1a1a35/666'}" onerror="this.src='https://placehold.co/400x250/1a1a35/666'"><div class="card-img-overlay"></div><div class="card-cat">${i.category||''}</div><div class="card-badge ${i.available?'badge-on':'badge-off'}">${i.available?t('available'):t('unavailable')}</div></div><div class="card-body"><h3>${i.name}</h3><p>${i.description||''}</p><div class="card-foot"><span class="price price-gradient">${i.price||0} ${t('currency')}</span></div></div></div>`).join('');
        }

        function showAdminList() {
            const c = document.getElementById('adminList');
            if (!items.length) { c.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text2);">${t('noItems')}</div>`; return; }
            c.innerHTML = items.map(i => `<div class="list-row"><img src="${i.image||'https://placehold.co/40/333/666'}" onerror="this.src='https://placehold.co/40/333/666'"><div class="linfo"><h4>${i.name}</h4><span>${i.category||''} · ${i.available?t('available'):t('unavailable')}</span></div><div class="lprice">${i.price||0} ${t('currency')}</div><div class="lacts"><button class="btn-xs ed" onclick="editItem('${i.fid}')">✏️</button><button class="btn-xs dl" onclick="delItem('${i.fid}')">🗑️</button></div></div>`).join('');
        }

        async function addItem() {
            const n = document.getElementById('itemName').value.trim(), p = +document.getElementById('itemPrice').value;
            if (!n || isNaN(p)) { toast(t('toastFill')); return; }
            let img = ''; if (file) { try { document.getElementById('btnAdd').textContent = '⏳...'; document.getElementById('btnAdd').disabled = true; img = await uploadImg(file); } catch { toast(t('toastImgFail')); resetBtn(); return; } }
            try { document.getElementById('btnAdd').textContent = '⏳...'; await db.add({ name: n, category: document.getElementById('itemCat').value, description: document.getElementById('itemDesc').value.trim() || '', price: p, image: img || 'https://placehold.co/400x250/1a1a35/666', available: true, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); resetForm(); await loadData(); toast(t('toastAdded')); } catch { toast(t('toastError')); }
            resetBtn();
        }
        function resetBtn() { document.getElementById('btnAdd').textContent = t('addBtn'); document.getElementById('btnAdd').disabled = false; }

        function editItem(fid) {
            const i = items.find(x => x.fid === fid); if (!i) return;
            document.getElementById('editId').value = fid; document.getElementById('itemName').value = i.name || '';
            document.getElementById('itemCat').value = i.category || t('categories')[0]; document.getElementById('itemDesc').value = i.description || '';
            document.getElementById('itemPrice').value = i.price || ''; if (i.image?.startsWith('http')) { document.getElementById('previewImg').src = i.image; document.getElementById('previewImg').style.display = 'block'; }
            file = null; document.getElementById('formTitle').textContent = t('formTitleEdit') + i.name;
            document.getElementById('btnAdd').style.display = 'none'; document.getElementById('btnUpdate').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function updateItem() {
            const fid = document.getElementById('editId').value; if (!fid) return;
            const n = document.getElementById('itemName').value.trim(), p = +document.getElementById('itemPrice').value;
            if (!n || isNaN(p)) { toast(t('toastFill')); return; }
            let img = document.getElementById('previewImg').src; if (file) { try { document.getElementById('btnUpdate').textContent = '⏳...'; document.getElementById('btnUpdate').disabled = true; img = await uploadImg(file); } catch { toast(t('toastImgFail')); resetUpdateBtn(); return; } }
            try { document.getElementById('btnUpdate').textContent = '⏳...'; await db.doc(fid).update({ name: n, category: document.getElementById('itemCat').value, description: document.getElementById('itemDesc').value.trim() || '', price: p, image: img || 'https://placehold.co/400x250/1a1a35/666', updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); resetForm(); await loadData(); toast(t('toastUpdated')); } catch { toast(t('toastError')); }
            resetUpdateBtn();
        }
        function resetUpdateBtn() { document.getElementById('btnUpdate').textContent = t('saveBtn'); document.getElementById('btnUpdate').disabled = false; }

        async function delItem(fid) { if (!confirm(t('confirmDel'))) return; try { await db.doc(fid).delete(); await loadData(); toast(t('toastDeleted')); } catch { toast(t('toastError')); } }

        function resetForm() {
            document.getElementById('editId').value = ''; document.getElementById('itemName').value = '';
            document.getElementById('itemCat').value = t('categories')[0]; document.getElementById('itemDesc').value = '';
            document.getElementById('itemPrice').value = ''; document.getElementById('previewImg').style.display = 'none';
            document.getElementById('fileInput').value = ''; document.getElementById('progBar').style.display = 'none'; file = null;
            const fb = document.getElementById('fileBox'); fb.classList.remove('ok'); fb.querySelector('.ftxt').textContent = t('uploadText'); fb.querySelector('.fico').textContent = '📁';
            document.getElementById('formTitle').textContent = t('formTitle'); document.getElementById('btnAdd').style.display = 'block'; document.getElementById('btnUpdate').style.display = 'none';
            resetBtn(); resetUpdateBtn();
        }

        function closePassModal() { document.getElementById('passModal').classList.remove('show'); }
        function checkPass() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passInput').value;
            if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
                closePassModal(); document.getElementById('adminPanel').classList.add('show');
                showAdminList(); document.body.style.overflow = 'hidden';
            } else { document.getElementById('errMsg').style.display = 'block'; }
        }
        function closeAdmin() { document.getElementById('adminPanel').classList.remove('show'); document.body.style.overflow = ''; resetForm(); loadData(); }

        document.getElementById('settingsModal').addEventListener('click', function(e) { if (e.target === this) closeSettings(); });
        document.getElementById('passModal').addEventListener('click', function(e) { if (e.target === this) closePassModal(); });
        document.getElementById('passInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkPass(); });

        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === 'en' ? 'ltr' : 'rtl';
        document.body.style.fontFamily = currentLang === 'en' ? 'var(--font-en)' : 'var(--font-ar)';
        applyDarkMode(); changeLanguage(currentLang); loadData();
    </script>
</body>
</html>
